<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Promos - Pomodoro Rock</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Arial Black', sans-serif;
      color: #fff;
      background: url("8c27c25e-cfa5-40f0-982e-4df612a9aae0.jpg") no-repeat center center fixed;
      background-size: cover;
      text-align: center;
    }

    .container {
      background: rgba(0, 0, 0, 0.6);
      padding: 40px 20px;
    }

    h1 {
      font-size: 3em;
      text-shadow: 2px 2px #ff6347;
      margin-bottom: 30px;
    }

    .promo {
      font-size: 1.8em;
      margin: 20px 0;
      text-shadow: 2px 2px #000;
    }

    .whatsapp {
      display: inline-block;
      margin-top: 30px;
      background-color: #25D366;
      color: white;
      padding: 15px 30px;
      font-size: 1.2em;
      border-radius: 30px;
      text-decoration: none;
      transition: background-color 0.3s;
    }

    .whatsapp:hover {
      background-color: #1ebc5c;
    }

    .info {
      margin-top: 20px;
      font-size: 1.2em;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Promos</h1>

    <div class="promo">
      🍔 Hamburguesa simple a elección + una pinta <strong>$10.000</strong>
    </div>

    <div class="promo">
      🍕 Pizza especial + 2 pintas <strong>$13.500</strong>
    </div>

    <div class="info">
      A partir de las <strong>19:00 hs</strong><br>
      ¡Podés hacer tu pedido!
    </div>

    <a class="whatsapp" href="https://wa.me/549XXXXXXXXXX?text=Hola!%20Quiero%20hacer%20un%20pedido" target="_blank">
      Hacer pedido por WhatsApp
    </a>

    <div class="info" style="margin-top: 30px;">
      Pomodoro Rock 🍕🎸
    </div>
  </div>
</body>
</html>
